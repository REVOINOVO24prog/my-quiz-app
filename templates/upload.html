<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz App - Upload File</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding-top: 100px; }
        .upload-box { border: 2px dashed #00e676; padding: 40px; display: inline-block; border-radius: 10px; background: #1e1e1e; }
        input[type="file"] { margin: 20px 0; }
        button { background: #00e676; color: #000; font-weight: bold; padding: 10px 25px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #00c853; }
    </style>
</head>
<body>
    <div class="upload-box">
        <h2>Upload Question File (.txt)</h2>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept=".txt" required><br>
            <button type="submit">Process & Build Dashboard</button>
        </form>
    </div>
</body>
</html>
